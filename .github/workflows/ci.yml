name: Platform foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependency manager
        run: python -m pip install uv==0.13.4
      - name: Restore frozen environment
        run: uv sync --frozen
      - name: Tests and contracts
        run: make check
      - name: Synthetic agent smoke test
        run: make demo
      - name: Build package
        run: uv build
      - name: Verify offline restoration with cached artifacts
        run: uv sync --frozen --offline
